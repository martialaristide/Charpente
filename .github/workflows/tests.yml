name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python-version: ["3.9", "3.12"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install a C/C++ compiler (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential

      # windows-latest ships MSVC via the preinstalled Visual Studio Build
      # Tools; macos-latest ships Apple Clang via Xcode Command Line Tools.
      # Neither needs an extra install step here.

      - name: Install Charpente
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -v
