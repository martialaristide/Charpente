name: Tests

on:
  push:
    branches: [main, "dev/**"]
  pull_request:

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: ruff
        run: ruff check .
      - name: mypy (strict)
        run: mypy charpente

  test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python-version: ["3.9", "3.12"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install a C/C++ compiler (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential

      # windows-latest ships MSVC via the preinstalled Visual Studio Build
      # Tools; macos-latest ships Apple Clang via Xcode Command Line Tools.
      # Neither needs an extra install step here.

      - name: Install Charpente
        run: pip install -e ".[dev]"

      - name: Run tests with coverage
        run: pytest -v --cov=charpente --cov-report=term-missing --cov-fail-under=75

  package:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - name: Install the wheel in a clean environment and run it
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/charpente --version
          /tmp/clean/bin/charpente explain CH3001
