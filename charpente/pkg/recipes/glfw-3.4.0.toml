# Charpente recipe -- data only, nothing here is executed.
[package]
name = "glfw"
version = "3.4.0"
license = "Zlib"
description = "Windows, contexts and input for OpenGL/Vulkan applications"
homepage = "https://www.glfw.org"
purl = "pkg:github/glfw/glfw"

[source]
url = "https://github.com/glfw/glfw/archive/refs/tags/3.4.tar.gz"
sha256 = "c038d34200234d071fae9345bc455e4a8f2f544ab60150765d7704e08f3dac01"
strip_prefix = "glfw-3.4"

[build]
type = "sources"
language = "c"
standard = "c99"
sources = ["src/context.c", "src/init.c", "src/input.c", "src/monitor.c", "src/platform.c", "src/vulkan.c", "src/window.c",
           "src/egl_context.c", "src/osmesa_context.c", "src/null_init.c", "src/null_monitor.c", "src/null_window.c",
           "src/null_joystick.c"]
include_dirs = ["include"]
private_include_dirs = ["src"]
keep = ["include/**", "src/**", "LICENSE.md"]

# Verified on Windows (MinGW). The Linux (X11) and macOS (Cocoa) lists follow GLFW's own CMake files and were NOT built here:
# X11 headers and the Apple SDK were not available.
[build.platform."windows-*"]
private_defines = ["_GLFW_WIN32", "UNICODE", "_UNICODE"]
sources = ["src/win32_module.c", "src/win32_time.c", "src/win32_thread.c", "src/win32_init.c", "src/win32_joystick.c",
           "src/win32_monitor.c", "src/win32_window.c", "src/wgl_context.c"]
links = ["gdi32"]

[build.platform."linux-*"]
private_defines = ["_GLFW_X11"]
sources = ["src/x11_init.c", "src/x11_monitor.c", "src/x11_window.c", "src/xkb_unicode.c", "src/glx_context.c",
           "src/posix_module.c", "src/posix_poll.c", "src/posix_time.c", "src/posix_thread.c", "src/linux_joystick.c"]
links = ["X11", "dl", "pthread", "m"]

[build.platform."macos-*"]
private_defines = ["_GLFW_COCOA"]
sources = ["src/cocoa_init.m", "src/cocoa_joystick.m", "src/cocoa_monitor.m", "src/cocoa_window.m", "src/nsgl_context.m",
           "src/cocoa_time.c", "src/posix_module.c", "src/posix_thread.c"]

[dependencies]
requires = []
