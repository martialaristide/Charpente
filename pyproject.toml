[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "charpente"
dynamic = ["version"]
description = "Cross-platform C/C++ build system driven by a Python DSL"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
    { name = "Martial Aristide Barra", email = "martialaristidebarra02@gmail.com" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "colorama>=0.4.4; sys_platform == 'win32'",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
ai = ["anthropic>=0.34.0", "openai>=1.40.0"]
fast = ["blake3>=0.4"]
rich = ["rich>=13"]
tui = ["textual>=0.60"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "jsonschema>=4.0",
    "rich>=13",
    "blake3>=0.4",
    "textual>=0.60",
    "build",
    "twine",
    "pywinpty>=2.0; sys_platform == 'win32'",
    "pyte>=0.8",
]

[project.urls]
Source = "https://github.com/martialaristide/Charpente"
Issues = "https://github.com/martialaristide/Charpente/issues"

[project.scripts]
charpente = "charpente.cli:main"

[tool.setuptools.packages.find]
include = ["charpente*"]

# Data files must be listed: setuptools leaves out everything that is not Python. (Recipes, kit sources and project
# templates were missing from the wheel until this was declared -- tests/test_packaging.py now guards it.)
[tool.setuptools.package-data]
charpente = ["pkg/recipes/*.toml", "pkg/kits/*.toml", "kit_sources/**/*", "templates_data/**/*",
             "modules/official/*.toml", "studio_web/**/*"]

[tool.setuptools.dynamic]
version = { attr = "charpente._version.__version__" }

[tool.ruff]
line-length = 120
target-version = "py39"
extend-exclude = ["build", "dist", "studio", "vscode-charpente", "charpente/templates_data", "charpente/kit_sources"]

[tool.ruff.lint]
# Deliberately small and stable: bugs (F, B), imports (I), pycodestyle errors (E).
select = ["E", "F", "I", "B", "W"]
ignore = [
    "E501",  # long lines: enforced by review, not by the linter (long user-facing messages)
    "B008",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "E402"]

[tool.mypy]
strict = true
warn_unused_configs = true
exclude = ["templates_data", "kit_sources"]

[[tool.mypy.overrides]]
# Optional AI SDKs: imported lazily, absent unless the `ai` extra is installed.
module = ["anthropic", "openai"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["charpente"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
